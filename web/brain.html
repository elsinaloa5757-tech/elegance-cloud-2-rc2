<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elegance Brain 2.0</title><style>
:root{color-scheme:dark}body{margin:0;background:#02080d;color:#eefcff;font:15px system-ui}.wrap{max-width:1250px;margin:auto;padding:20px}h1{font:52px cursive;margin:8px 0;color:#91ebff}.muted{color:#9fc0ca}.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}.card{background:linear-gradient(145deg,#071923,#041017);border:1px solid #1c647f;border-radius:20px;padding:17px;box-shadow:0 12px 30px #0008}.n{font-size:30px;font-weight:850}.modules{grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-top:16px}.module h3{margin-top:0;color:#87e8ff}button,a{border:0;border-radius:12px;padding:10px 14px;background:#087ca5;color:white;text-decoration:none;font-weight:750}pre{white-space:pre-wrap;max-height:340px;overflow:auto;background:#020a0f;border-radius:14px;padding:12px}.ok{color:#91ffbc}.warn{color:#ffd285}
</style></head><body><main class="wrap"><h1>elegance Brain 2.0</h1><p class="muted">Núcleo comercial · WhatsApp · IA · Finanzas · Proveedores · Automatización · Analítica · Auditoría · Nube</p><div id="cards" class="grid cards"></div><section class="grid modules">
<div class="card module"><h3>Finanzas y utilidad</h3><div id="finance"></div></div><div class="card module"><h3>Analítica predictiva</h3><div id="analytics"></div></div><div class="card module"><h3>Integridad</h3><div id="integrity"></div></div><div class="card module"><h3>Auditoría reciente</h3><pre id="audit"></pre></div></section><p><a href="/cloud-admin">Panel administrativo</a> <a href="/ai-enterprise">Elegance AI</a> <button onclick="load()">Actualizar</button></p></main><script>
const money=n=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(n||0);async function load(){let [d,i]=await Promise.all([fetch('/api/brain/dashboard?days=30').then(r=>r.json()),fetch('/api/brain/integrity').then(r=>r.json())]);let m=d.modules||{};cards.innerHTML=[['Proveedores',m.suppliers],['Compras',m.purchases],['Conversaciones',m.conversations],['Reglas',m.rules],['Sync pendiente',m.pendingSync]].map(x=>`<div class=card><div class=n>${x[1]||0}</div>${x[0]}</div>`).join('');let f=d.finance||{};finance.innerHTML=`Ingresos <b>${money(f.income)}</b><br>Gastos <b>${money(f.expense)}</b><br>Utilidad <b>${money(f.profit)}</b>`;let a=d.analytics||{};analytics.innerHTML=`Productos analizados: <b>${a.productsAnalyzed||0}</b><br>Alertas de recompra: <b>${(a.recommendations||[]).length}</b>`;integrity.innerHTML=`Base de datos: <b class=${i.status==='ok'?'ok':'warn'}>${i.databaseQuickCheck}</b><br>Errores FK: <b>${(i.foreignKeyErrors||[]).length}</b><br>Cola pendiente: <b>${i.pendingOutbox||0}</b>`;audit.textContent=JSON.stringify(d.recentAudit||[],null,2)}load();</script></body></html>
