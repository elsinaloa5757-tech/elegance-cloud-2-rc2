<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elegance Cloud 1.4</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#02080d;color:#edfaff;font:15px system-ui}.shell{display:grid;min-height:100vh}.side{padding:18px;background:#06131c;border-right:1px solid #174b63}.brand{font:42px cursive;color:#84eaff}.side a{display:block;color:#dff8ff;text-decoration:none;padding:11px;border-radius:12px;margin:5px 0}.side a:hover{background:#0d2b3a}.main{padding:20px;max-width:1450px;width:100%}.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.top input{flex:1;min-width:220px}.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin:18px 0}.card{background:#071823;border:1px solid #245f79;border-radius:20px;padding:16px;box-shadow:0 14px 35px #0006}.metric{font-size:29px;font-weight:900;color:#80e7ff}.two{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}input,button{padding:12px;border-radius:12px;border:1px solid #287b9c;background:#06121a;color:white}button{background:#087da6;font-weight:800;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #173847;text-align:left}.pill{padding:5px 9px;border-radius:99px;background:#123243}.results{position:absolute;background:#071823;border:1px solid #287b9c;border-radius:14px;max-width:700px;width:calc(100% - 40px);z-index:5}.results a{display:block;padding:10px;color:white;text-decoration:none;border-bottom:1px solid #173847}@media(min-width:900px){.shell{grid-template-columns:240px 1fr}.side{position:sticky;top:0;height:100vh}}@media(max-width:899px){.side{border-right:0;border-bottom:1px solid #174b63}.side nav{display:flex;gap:4px;overflow:auto}.side a{white-space:nowrap}}
</style></head><body><div class="shell"><aside class="side"><div class="brand">elegance</div><p>Panel Cloud 1.4</p><nav><a href="/cloud-admin">Dashboard</a><a href="/catalog-admin">Productos</a><a href="/commercial-cloud">Ventas</a><a href="/inventory">Inventario</a><a href="/publication-center">Publicación</a><a href="/backups">Respaldos</a><a href="/system-status">Sistema</a></nav></aside><main class="main"><div class="top"><div><h1>Panel administrativo</h1><span class="pill">Responsive · Seguro · Unificado</span></div><input id="search" placeholder="Buscar producto, cliente, pedido o guía"><button onclick="logout()">Cerrar sesión</button></div><div id="results" class="results" hidden></div><section id="cards" class="grid cards"></section><section class="grid two"><div class="card"><h2>Ventas recientes</h2><table><thead><tr><th>Día</th><th>Pedidos</th><th>Ingresos</th></tr></thead><tbody id="daily"></tbody></table></div><div class="card"><h2>Alertas de inventario</h2><table><thead><tr><th>Producto</th><th>Stock</th></tr></thead><tbody id="low"></tbody></table></div><div class="card"><h2>Productos destacados</h2><table><tbody id="top"></tbody></table></div><div class="card"><h2>Actividad y seguridad</h2><table><tbody id="audit"></tbody></table></div></section></main></div><script>
const money=n=>'$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2});
async function load(){const j=await(await fetch('/api/admin/dashboard?days=30')).json();const m=j.metrics||{};cards.innerHTML=[['Productos',m.products],['Clientes',m.customers],['Pedidos',m.orders],['Ventas 30d',m.salesCount],['Ingresos',money(m.revenue)],['Ticket promedio',money(m.averageTicket)],['Apartados',m.layaways],['Envíos pendientes',m.pendingDeliveries],['Stock bajo',m.lowStock]].map(x=>`<div class=card><div class=metric>${x[1]??0}</div>${x[0]}</div>`).join('');daily.innerHTML=(j.daily||[]).slice(-12).reverse().map(x=>`<tr><td>${x.day}</td><td>${x.orders_count}</td><td>${money(x.revenue)}</td></tr>`).join('')||'<tr><td colspan=3>Sin ventas todavía</td></tr>';low.innerHTML=(j.lowStockProducts||[]).map(x=>`<tr><td>${x.title}</td><td>${x.stock}</td></tr>`).join('')||'<tr><td colspan=2>Sin alertas</td></tr>';top.innerHTML=(j.topProducts||[]).map(x=>`<tr><td>${x.title}</td><td>${x.units||0} uds.</td><td>${money(x.revenue)}</td></tr>`).join('')||'<tr><td>Sin datos</td></tr>';audit.innerHTML=(j.recentActivity||[]).slice(0,12).map(x=>`<tr><td>${x.event}</td><td>${x.username||'sistema'}</td><td>${(x.created_at||'').slice(0,16).replace('T',' ')}</td></tr>`).join('')||'<tr><td>Sin actividad</td></tr>'}
let timer;search.oninput=()=>{clearTimeout(timer);timer=setTimeout(async()=>{let q=search.value.trim();if(!q){results.hidden=true;return}let j=await(await fetch('/api/admin/search?q='+encodeURIComponent(q))).json();results.innerHTML=(j.results||[]).map(x=>`<a href="${x.href}"><b>${x.label}</b><br><small>${x.kind} · ${x.secondary||''}</small></a>`).join('')||'<a>Sin resultados</a>';results.hidden=false},250)};async function logout(){await fetch('/api/auth/logout',{method:'POST'});location='/login'}load();
</script></body></html>
