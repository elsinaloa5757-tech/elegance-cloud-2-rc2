<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Base de datos | Elegance</title><link rel="stylesheet" href="/assets/web/elegance.css"><style>.wrap{max-width:1050px;margin:auto;padding:28px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.card{background:#09121a;border:1px solid #273745;border-radius:18px;padding:18px}.value{font-size:1.35rem;font-weight:800;word-break:break-all}.ok{color:#9de9ff}.bad{color:#ff9e9e}button,a.btn{padding:12px 18px;border-radius:14px;border:0;font-weight:800}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}</style></head><body><main class="wrap"><h1>Diagnóstico de base de datos</h1><p>Confirma que Elegance utiliza siempre la carpeta persistente del servidor.</p><div id="grid" class="grid"><div class="card">Consultando…</div></div><div class="actions"><button onclick="backup()">Crear primer respaldo</button><a class="btn" href="/backups">Administrar respaldos</a><a class="btn" href="/admin">Volver al panel</a></div><p id="msg"></p></main><script>
async function load(){const r=await fetch('/api/admin/database/diagnostics');const j=await r.json();const fields=[['Estado',j.status],['Integridad',j.integrity],['Propietarios',j.ownerCount],['Usuarios',j.userCount],['Productos',j.productCount??'No disponible'],['Tamaño',(j.size/1048576).toFixed(2)+' MB'],['Base activa',j.path],['Carpeta persistente',j.dataDir],['WAL',j.walExists?'Sí':'No'],['Última modificación',j.modified||'No disponible']];grid.innerHTML=fields.map(x=>`<div class=card><small>${x[0]}</small><div class="value ${(x[1]==='ok'||x[1]===1)?'ok':''}">${x[1]}</div></div>`).join('')}
async function backup(){msg.textContent='Creando respaldo…';const r=await fetch('/api/admin/backups',{method:'POST'});const j=await r.json();msg.textContent=r.ok?'Respaldo creado: '+j.name:'No se pudo crear el respaldo.'}
load().catch(e=>grid.innerHTML='<div class="card bad">Error: '+e+'</div>')</script></body></html>
