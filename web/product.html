<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#05070a"><title>{{TITLE}} | Elegance</title><meta name="description" content="{{DESCRIPTION}}"><meta property="og:type" content="product"><meta property="og:title" content="{{TITLE}} | Elegance"><meta property="og:description" content="{{DESCRIPTION}}"><meta property="og:image" content="{{IMAGE}}"><meta property="product:price:amount" content="{{PRICE}}"><meta property="product:price:currency" content="MXN"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/assets/web/elegance.css"></head><body><div class="network-banner" id="networkBanner">Sin conexión.</div><header class="site-header compact"><a class="brand" href="/"><span>elegance</span><small>PRODUCTO</small></a><nav><a href="/catalog">← Catálogo</a></nav><div class="header-actions"><button class="cart-link" onclick="location='/catalog#carrito'">Carrito <b data-cart-count>0</b></button></div></header>
<main class="product-page" id="productPage"><div class="product-gallery"><div class="main-image"><img id="mainProductImage" src="{{IMAGE}}" alt="{{TITLE}}"><button id="zoomBtn">Ampliar</button></div><div class="thumbs" id="productThumbs"></div></div><section class="product-info"><p class="eyebrow" id="productBrand"></p><h1 id="productTitle">{{TITLE}}</h1><div class="price-row"><strong id="productPrice">{{PRICE}}</strong><span id="oldPrice"></span></div><p id="productStatus"></p><p class="product-description" id="productDescription">{{DESCRIPTION}}</p><div class="selector"><span>Talla</span><div id="sizeOptions" class="option-grid"></div></div><div class="selector"><span>Color</span><div id="colorOptions" class="option-grid"></div></div><label class="quantity">Cantidad<input id="quantity" type="number" min="1" value="1"></label><button class="btn primary full" id="addProduct">Agregar al carrito</button><button class="btn secondary full" id="buyWhatsapp">Comprar por WhatsApp</button><div class="inline-actions"><button id="favoriteProduct">♡ Guardar</button><button id="shareProduct">Compartir</button></div><div class="delivery-note"><b>Atención Elegance</b><p>Confirma disponibilidad, entrega o envío directamente por WhatsApp.</p></div></section></main><section class="section"><div class="section-head"><h2>También podría gustarte</h2><a href="/catalog">Ver catálogo</a></div><div class="product-grid" id="relatedProducts"></div></section><div class="zoom-modal" id="zoomModal"><button id="closeZoom">×</button><img id="zoomImage" src="{{IMAGE}}"></div><script id="productData" type="application/json">{{PRODUCT_JSON}}</script><script src="/assets/web/elegance.js" defer></script><script src="/assets/web/product.js" defer></script></body></html>
