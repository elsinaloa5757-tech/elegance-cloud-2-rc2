<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventario · Elegance</title><style>body{margin:0;background:#02070b;color:#eefaff;font:16px system-ui}.w{max-width:1180px;margin:auto;padding:18px}.brand{font:46px cursive;color:#70e1ff}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a{background:#122733;color:#70e1ff;padding:11px 14px;border-radius:12px;text-decoration:none}.card{background:#09151d;border:1px solid #29495a;border-radius:18px;padding:16px;margin:12px 0}.product{display:grid;grid-template-columns:100px 1fr;gap:15px}.product img{width:100px;height:100px;object-fit:cover;border-radius:14px}.variant{display:grid;grid-template-columns:1fr 90px 100px 1fr 90px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #203746}input,button{padding:10px;border-radius:10px;border:1px solid #31586c;background:#071018;color:white}button{background:#65d8f8;color:#021017;font-weight:800}@media(max-width:700px){.product{grid-template-columns:1fr}.variant{grid-template-columns:1fr 1fr}.variant span:first-child{grid-column:1/-1}}</style></head><body><main class=w><div class=brand>elegance</div><h1>Inventario</h1><div class=nav><a href=/new-product>+ Nuevo producto</a><a href=/commercial>Clientes y pedidos</a><a href=/catalog-admin>Publicaciones</a><a href=/backups>Respaldos</a><a href=/admin>Panel</a></div><p id=sum></p><div id=list></div></main><script>async function load(){let j=await fetch('/api/inventory/products').then(r=>r.json());sum.textContent=`${j.products.length} productos registrados · ${j.products.filter(p=>p.lowStock).length} con existencia baja`;list.innerHTML=j.products.map(p=>{let img=(p.approvedStudioImages||p.originalImages||[])[0]||'/assets/web/elegance-hero.png';let vars=(p.variants||[]).map(v=>`<div class=variant><span>Talla: ${v.size||'General'} · Color: ${v.color||'Sin especificar'}</span><span>Stock: <b>${v.stock}</b></span><input id=q_${v.id} type=number value=1><input id=n_${v.id} placeholder='Nota'><button onclick="adjust('${p.id}','${v.id}')">Aplicar</button></div>`).join('')||'<p>Sin variantes registradas.</p>';return `<section class=card><div class=product><img src="${img}"><div><h2>${p.title||p.id}</h2><p>${p.brand||''} ${p.model||''} · ${p.category||''}</p><p>Existencia total: <b>${p.stock}</b> · Venta: $${Number(p.price||0).toLocaleString()}</p>${vars}</div></div></section>`}).join('')||'<div class=card>No hay productos. Usa “Nuevo producto”.</div>'}async function adjust(pid,vid){let q=Number(document.getElementById('q_'+vid).value),note=document.getElementById('n_'+vid).value;let r=await fetch('/api/inventory/adjust',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({productId:pid,variantId:vid,quantity:q,note})});let j=await r.json();if(!r.ok)alert(j.detail);else load()}load()</script></body></html>
