<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biblioteca — Elegance</title><style>body{margin:0;background:#02070b;color:#eefaff;font:15px system-ui}.w{max-width:1400px;margin:auto;padding:20px}h1{font:52px cursive;color:#69ddff;margin:0}.bar{position:sticky;top:0;background:#02070bee;padding:12px 0;display:flex;gap:8px;z-index:2;flex-wrap:wrap}button,a{background:#69ddff;color:#031017;border:0;border-radius:11px;padding:11px 14px;font-weight:800;text-decoration:none;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.card{background:#091620;border:1px solid #2c5a70;border-radius:16px;padding:10px}.card img{width:100%;height:190px;object-fit:contain;background:#061018;border-radius:12px}.muted{color:#a9c2ce;font-size:12px}.empty{padding:50px;text-align:center}</style></head><body><main class="w"><h1>Biblioteca Elegance</h1><p>Los archivos se conservan. Archivar o enviar a papelera solo cambia su estado; no elimina físicamente el original.</p><div class="bar"><a href="/admin">Panel</a><button onclick="loadAssets('active')">Activos</button><button onclick="loadAssets('archived')">Archivados</button><button onclick="loadAssets('trash')">Papelera</button><button onclick="backfill()">Registrar archivos existentes</button></div><div id="msg"></div><section id="grid" class="grid"></section></main><script>let current='active';async function api(u,o){let r=await fetch(u,o),j=await r.json();if(!r.ok)throw Error(j.detail||'Error');return j}function esc(x){return String(x||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}async function loadAssets(st='active'){current=st;let j=await api('/api/media/assets?status='+st);grid.innerHTML=j.assets.length?j.assets.map(x=>`<article class="card"><img src="${esc(x.stored_path)}"><b>${esc(x.original_name)}</b><div class="muted">${esc(x.kind)} · ${esc(x.product_id||'Sin producto')}<br>${esc(x.sha256.slice(0,16))}</div><button onclick="setStatus('${x.id}','${st==='active'?'archived':'active'}')">${st==='active'?'Archivar':'Restaurar'}</button>${st!=='trash'?`<button onclick="setStatus('${x.id}','trash')">Papelera</button>`:''}</article>`).join(''):'<div class="empty">No hay archivos en este estado.</div>'}async function setStatus(id,status){await api('/api/media/assets/'+id+'/status',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({status})});loadAssets(current)}async function backfill(){let j=await api('/api/media/backfill',{method:'POST'});msg.textContent='Archivos registrados: '+j.registered;loadAssets(current)}loadAssets()</script></body></html>
