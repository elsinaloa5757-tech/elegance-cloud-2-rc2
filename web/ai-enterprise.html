<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elegance AI Enterprise</title><style>
body{margin:0;background:#07131d;color:#eef9ff;font-family:system-ui}main{max-width:1100px;margin:auto;padding:24px}.hero,.card{background:#0d2232;border:1px solid #8be4ff44;border-radius:22px;padding:22px;margin:14px 0}h1{font-size:clamp(28px,5vw,54px);margin:0}.accent{color:#8be4ff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}button,input{padding:13px;border-radius:12px;border:1px solid #8be4ff66;background:#102c40;color:white}button{cursor:pointer}pre{white-space:pre-wrap;overflow:auto;background:#061018;padding:16px;border-radius:14px}.muted{opacity:.75}</style></head><body><main>
<section class="hero"><h1>Elegance <span class="accent">AI Enterprise</span></h1><p>Clasificación, sugerencias, huellas visuales, duplicados, precios y procesamiento local con confirmación administrativa.</p></section>
<section class="card"><div class="grid"><input id="pid" placeholder="ID del producto"><button onclick="analyze()">Analizar producto</button><button onclick="duplicates()">Buscar duplicados</button><button onclick="batch()">Analizar catálogo</button></div><p class="muted">Las propuestas no reemplazan datos confirmados sin autorización.</p><pre id="out">Esperando acción…</pre></section>
<script>const out=document.querySelector('#out');async function call(u,o){out.textContent='Procesando…';let r=await fetch(u,o);out.textContent=JSON.stringify(await r.json(),null,2)}function analyze(){call('/api/ai-enterprise/analyze/'+encodeURIComponent(pid.value))}function duplicates(){call('/api/ai-enterprise/duplicates')}function batch(){call('/api/ai-enterprise/batch',{method:'POST',headers:{'content-type':'application/json'},body:'{"limit":100}'})}</script></main></body></html>
