<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Servidor Elegance</title><link rel="stylesheet" href="/assets/web/elegance.css"></head>
<body><main style="max-width:1000px;margin:auto;padding:24px"><h1>Servidor propio Elegance</h1><p id="summary">Consultando estado…</p><section id="cards" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px"></section><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"><button onclick="backup('daily')">Crear respaldo diario</button><button onclick="backup('weekly')">Crear respaldo semanal</button><a href="/backups">Administrar respaldos</a></div><pre id="result" style="white-space:pre-wrap"></pre></main>
<script>
const fmt=n=>n>1073741824?(n/1073741824).toFixed(1)+' GB':(n/1048576).toFixed(1)+' MB';
async function load(){const r=await fetch('/api/admin/home-server'); if(!r.ok){location='/login?next=/server-status';return} const x=await r.json();document.getElementById('summary').textContent=x.publicAccess.configured?'URL pública configurada':'Servidor local listo; falta activar URL pública';const items=[['Servidor',x.server.schedulerRunning?'Activo':'Sin programador'],['Base',x.database.engine],['Espacio libre',fmt(x.storage.free)+' ('+x.storage.freePercent+'%)'],['Respaldos',x.backup.count],['Último respaldo',x.backup.latest?.modified||'Aún no existe'],['Copia externa',x.backup.externalDirectoryConfigured?'Configurada':'Pendiente']];document.getElementById('cards').innerHTML=items.map(i=>`<article style="padding:16px;border:1px solid #ccc;border-radius:14px"><small>${i[0]}</small><h2>${i[1]}</h2></article>`).join('')}
async function backup(kind){const r=await fetch('/api/admin/home-server/backups/run?kind='+kind,{method:'POST'});document.getElementById('result').textContent=JSON.stringify(await r.json(),null,2);load()}load();
</script></body></html>
