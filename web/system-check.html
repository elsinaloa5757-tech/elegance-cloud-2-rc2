<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificación del sistema | Elegance</title><link rel="stylesheet" href="/assets/web/elegance.css"><style>.wrap{max-width:1100px;margin:auto;padding:40px 24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.check{padding:22px;border:1px solid #263642;border-radius:20px;background:#0a1219}.check b{display:block;font-size:1.05rem}.ok{color:#8de7b2}.bad{color:#ff9b9b}.detail{opacity:.72;word-break:break-all;margin-top:8px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}</style></head><body><main class="wrap"><div class="brand"><span>elegance</span><small>ESTABILIZACIÓN</small></div><p class="eyebrow">VERIFICACIÓN INTEGRAL</p><h1>Estado real del sistema</h1><p id="summary">Comprobando base, propietario, catálogo y respaldos…</p><div class="actions"><a class="btn primary" href="/admin">Abrir administración</a><a class="btn" href="/database-diagnostics">Diagnóstico de base</a><button class="btn" onclick="load()">Volver a comprobar</button></div><section id="grid" class="grid"></section></main><script>async function load(){const r=await fetch('/api/admin/system-check');if(r.status===401){location='/login?next=/system-check';return}const j=await r.json();summary.textContent=j.status==='ok'?'Sistema listo para operar.':'Hay elementos que requieren atención.';grid.innerHTML=j.checks.map(x=>`<article class="check"><b class="${x.ok?'ok':'bad'}">${x.ok?'✓':'✕'} ${x.label}</b><div class="detail">${x.detail??''}</div></article>`).join('')}load()</script></body></html>
