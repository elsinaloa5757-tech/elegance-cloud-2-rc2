<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revisión de productos — Elegance</title><style>
:root{--ice:#69ddff;--bg:#02070b;--panel:#091620;--line:#2c5a70;--muted:#a9c2ce;--danger:#742d35}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eefaff;font:15px system-ui}.w{max-width:1450px;margin:auto;padding:18px}h1{font:52px cursive;color:var(--ice);margin:0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top a,button{background:var(--ice);color:#031017;text-decoration:none;border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;margin:16px 0}.review-grid{display:grid;grid-template-columns:minmax(360px,.9fr) minmax(480px,1.1fr);gap:18px}.viewer{background:#03090d;border:1px solid #24495b;border-radius:18px;padding:12px}.main-image{width:100%;height:min(55vh,620px);object-fit:contain;background:#111820;border-radius:14px;cursor:zoom-in}.thumbs{display:flex;gap:8px;overflow:auto;padding:10px 0}.thumb{min-width:88px;width:88px;border:2px solid transparent;border-radius:12px;padding:4px;background:#071119;position:relative}.thumb.active,.thumb.cover{border-color:var(--ice)}.thumb img{width:100%;height:78px;object-fit:cover;border-radius:8px}.thumb .cover-dot{position:absolute;top:6px;right:6px;background:var(--ice);color:#001018;border-radius:99px;padding:2px 6px;font-size:10px}.image-actions,.actions,.row{display:flex;gap:8px;flex-wrap:wrap}.image-actions button,.actions button{flex:1;min-width:130px}.secondary{background:#142a36;color:white}.danger{background:var(--danger);color:white}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}label{display:block;color:#c9e9f6;margin:4px 0}input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#061018;color:white}.muted{color:var(--muted)}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#12313f;color:#bcefff}.attrs,.variants{border-top:1px solid #24495b;margin-top:12px;padding-top:12px}.variant{display:grid;grid-template-columns:1fr 1fr .7fr 1fr 1fr auto;gap:7px;margin:7px 0}.variant button{padding:8px 11px;background:var(--danger);color:white}.preview{display:grid;grid-template-columns:130px 1fr;gap:12px;background:#061018;border:1px solid #24495b;border-radius:15px;padding:12px;margin-top:12px}.preview img{width:130px;height:150px;object-fit:cover;border-radius:12px}.status{min-height:22px;margin-top:10px}.candidate-box{margin-top:12px;border-top:1px solid #24495b;padding-top:12px}.candidate-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.candidate{background:#061018;border:1px solid #2c5a70;border-radius:14px;padding:10px}.candidate img{width:100%;height:150px;object-fit:contain;background:#111820;border-radius:10px}.candidate small{color:#a9c2ce}.candidate .score{color:#75ffb1;font-weight:800}.candidate a{color:var(--ice)}.empty{text-align:center;padding:40px;color:#9cb4c0}.modal{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:100;padding:20px}.modal.open{display:grid}.modal img{max-width:95vw;max-height:90vh;object-fit:contain}.modal button{position:absolute;top:20px;right:20px}.sticky-actions{position:sticky;bottom:0;background:#091620ee;padding:10px 0;border-top:1px solid #24495b}.count{font-weight:800;color:var(--ice)}.bulkbar{position:sticky;top:0;z-index:90;background:#061018f2;border:1px solid #2c5a70;border-radius:16px;padding:10px;margin:12px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.bulkbar button{min-width:150px}.select-product{width:24px;height:24px;accent-color:var(--ice)}.card.selected{outline:2px solid var(--ice)}.bulk-progress{color:#75ffb1;font-weight:700}.lens-panel{display:none;margin-top:12px;padding:14px;border:1px solid #34718d;border-radius:16px;background:#061018}.lens-panel.open{display:block}.lens-panel h3{margin-top:0}.lens-help{background:#0d2430;border-radius:12px;padding:10px;margin:8px 0}.lens-actions{display:flex;gap:8px;flex-wrap:wrap}.lens-actions button{flex:1;min-width:180px}.found-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.compare-box{margin-top:10px;padding:10px;border:1px solid #2c5a70;border-radius:12px}.compare-row{display:grid;grid-template-columns:150px 1fr 1fr auto;gap:8px;align-items:center;margin:6px 0}.compare-row button{padding:7px 10px}@media(max-width:700px){.found-grid{grid-template-columns:1fr}.compare-row{grid-template-columns:1fr}}@media(max-width:950px){.review-grid{grid-template-columns:1fr}.main-image{height:45vh}}@media(max-width:650px){.w{padding:9px}.grid,.grid3{grid-template-columns:1fr}.variant{grid-template-columns:1fr 1fr}.variant button{grid-column:span 2}.top{align-items:flex-start;flex-direction:column}h1{font-size:40px}.preview{grid-template-columns:95px 1fr}.preview img{width:95px;height:115px}}
</style></head><body><main class="w"><div class="top"><div><h1>elegance</h1><h2>Revisión visual de productos</h2></div><div class="row"><a href="/automation">Volver al lote</a><a href="/new-product">Nuevo producto</a><a href="/catalog">Catálogo</a><a href="/intelligence">Inteligencia</a></div></div><p class="muted">Revisa fotografías, completa los datos y publica solamente cuando la ficha esté lista.</p><div class="bulkbar"><button onclick="selectAll(true)">Seleccionar todo</button><button class="secondary" onclick="selectAll(false)">Desmarcar todo</button><button onclick="bulkComplete()">Completar automáticamente todo</button><button onclick="bulkPublish()">Aprobar y publicar todo</button><button class="secondary" onclick="bulkDraft()">Guardar borradores</button><span id="bulkProgress" class="bulk-progress">0 seleccionados</span></div><div id="list">Cargando…</div></main><div class="modal" id="zoomModal" onclick="this.classList.remove('open')"><button>Cerrar</button><img id="zoomImage"></div>
<script>
let taxonomy={},fieldsByCategory={};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const media=p=>{p=String(p||'').replaceAll('\\','/');if(!p)return'';if(p.startsWith('/'))return p;if(p.startsWith('data/'))return'/media/'+p.slice(5);return'/media/'+p};
const labels={size:'Talla',number:'Número',material:'Material',color:'Color',gender:'Género',fit:'Corte',season:'Temporada',milliliters:'Mililitros',concentration:'Concentración',fragrance_name:'Nombre de fragancia',presentation:'Presentación',olfactory_family:'Familia olfativa',dimensions:'Medidas',compatibility:'Compatibilidad',type:'Tipo',capacity:'Capacidad'};
async function api(url,opt={}){let r=await fetch(url,opt),j=await r.json();if(!r.ok)throw Error(j.detail||'Error');return j}
async function load(){let t=await api('/api/universal/taxonomy');taxonomy=t.taxonomy||{};fieldsByCategory=t.fieldsByCategory||{};let j=await api('/api/universal/reviews?status=pending&limit=200');if(!j.reviews.length){list.innerHTML='<div class="card empty">No hay productos pendientes.</div>';return}let details=await Promise.all(j.reviews.map(x=>api('/api/universal/reviews/'+x.id).then(y=>y.review)));render(details)}
function variantRow(v={}){return `<div class="variant"><input data-v="size" placeholder="Talla / medida" value="${esc(v.size)}"><input data-v="color" placeholder="Color" value="${esc(v.color)}"><input data-v="stock" type="number" min="0" placeholder="Stock" value="${esc(v.stock??1)}"><input data-v="purchase_price" type="number" min="0" step=".01" placeholder="Costo" value="${esc(v.purchase_price??0)}"><input data-v="sale_price" type="number" min="0" step=".01" placeholder="Precio" value="${esc(v.sale_price??0)}"><button type="button" onclick="this.parentElement.remove();updatePreview(this.closest('.card'))">Quitar</button></div>`}
function render(rows){list.innerHTML=rows.map(r=>{let p=r.product||{},imgs=r.images||[],cover=p.catalogImage||imgs[0]||'',attrs=r.attributes||{},vars=(r.variants||[]);return `<section class="card" data-id="${r.id}" data-cover="${esc(cover)}"><label style="display:flex;align-items:center;gap:9px;font-weight:800"><input class="select-product" type="checkbox" onchange="selectionChanged()"> Seleccionar este producto</label><div class="review-grid"><div class="viewer"><div class="row" style="justify-content:space-between"><b>${esc(r.source_name||p.title||'Producto por confirmar')}</b><span class="badge">Confianza ${Math.round((r.confidence||0)*100)}%</span></div><p class="muted">${esc((r.evidence||[]).length?'Evidencias: '+r.evidence.join(', '):'Sin evidencia suficiente; requiere confirmación manual.')}</p>${imgs.length?`<img class="main-image" src="${media(cover)}" alt="Producto" onclick="zoom(this.src)"><div class="thumbs">${imgs.map((im,i)=>`<button type="button" class="thumb ${im===cover?'cover active':''}" data-image="${esc(im)}" onclick="selectImage(this)"><img src="${media(im)}" alt="Vista ${i+1}">${im===cover?'<span class="cover-dot">Portada</span>':''}</button>`).join('')}</div><div><span class="count">${imgs.length}</span> fotografías</div><div class="image-actions"><button type="button" onclick="setCover(this)">Elegir como portada</button><button type="button" class="secondary" onclick="zoom(this.closest('.viewer').querySelector('.main-image').src)">Zoom</button><button type="button" class="danger" onclick="removeImage(this)">Quitar fotografía</button></div>`:'<div class="empty">Este registro no tiene fotografías vinculadas.</div>'}<p class="muted">Para mover, dividir o unir fotografías entre grupos usa <a href="/automation" style="color:var(--ice)">Volver al lote</a>; la revisión conserva la integridad del producto ya creado.</p></div><div><div class="grid"><div><label>Nombre del producto *</label><input data-f="title" value="${esc(p.title||r.source_name)}"></div><div><label>Marca *</label><input data-f="brand" value="${esc(p.brand||r.proposed_brand)}"></div><div><label>Modelo *</label><input data-f="model" value="${esc(p.model||r.proposed_model)}"></div><div><label>Categoría *</label><select data-f="category" onchange="categoryChanged(this)">${Object.keys(taxonomy).map(x=>`<option ${x===(p.category||r.proposed_category)?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div><label>Subcategoría *</label><select data-f="subcategory"></select></div><div><label>Proveedor</label><input data-f="supplier" value="${esc(p.supplier||'')}"></div><div><label>Costo</label><input data-f="purchasePrice" type="number" min="0" step=".01" value="${esc(p.purchasePrice||0)}"></div><div><label>Precio de venta *</label><input data-f="price" type="number" min="0" step=".01" value="${esc(p.price||0)}"></div></div><label>Descripción</label><textarea data-f="description" rows="3">${esc(p.description||'')}</textarea><div class="attrs"><h3>Campos según categoría</h3><div class="grid attrs-grid"></div></div><div class="variants"><div class="row" style="justify-content:space-between;align-items:center"><h3>Variantes e inventario</h3><button type="button" class="secondary" onclick="addVariant(this)">+ Añadir variante</button></div><div class="variant-list">${vars.length?vars.map(variantRow).join(''):variantRow({stock:p.stock||1,sale_price:p.price||0,purchase_price:p.purchasePrice||0})}</div></div><h3>Vista previa del catálogo</h3><div class="preview"><img src="${media(cover)}"><div><b class="pv-title">${esc(p.title||r.source_name)}</b><p class="pv-route"></p><p class="pv-price"></p><p class="muted pv-description">${esc(p.description||'')}</p></div></div><div class="status muted"></div><div class="candidate-box" style="display:none"><h3>Mejores coincidencias</h3><p class="muted">El modelo exacto solo se aplica automáticamente con evidencia fuerte. También puedes elegir una coincidencia.</p><div class="candidate-grid"></div></div><div class="lens-panel"><h3>Elegance Visual Search Assistant</h3><div class="lens-help">Google Lens se abre de forma asistida. Elegance prepara la fotografía seleccionada; después pega aquí el texto o la URL del resultado correcto para registrar y aprender la coincidencia.</div><div class="lens-actions"><button type="button" onclick="downloadLensImage(this)">Descargar fotografía seleccionada</button><button type="button" class="secondary" onclick="launchLens(this)">Abrir Google Lens</button><button type="button" class="secondary" onclick="this.closest('.lens-panel').classList.remove('open')">Cerrar asistente</button></div><label>Texto copiado del resultado de Lens o de una tienda</label><textarea data-lens="pasted_text" rows="5" placeholder="Pega aquí nombre, modelo, código, colores y descripción..."></textarea><label>URL de evidencia</label><input data-lens="source_url" placeholder="https://..."><div class="found-grid"><div><label>Fuente</label><input data-lens="source" value="Google Lens (asistido)"></div><div><label>Confianza que asignas</label><input data-lens="confidence" type="number" min="0" max="100" value="90"></div><div><label>Nombre comercial</label><input data-lens="title"></div><div><label>Marca</label><input data-lens="brand"></div><div><label>Modelo</label><input data-lens="model"></div><div><label>SKU / código</label><input data-lens="sku"></div><div><label>Color</label><input data-lens="color"></div><div><label>Material</label><input data-lens="material"></div></div><label>Notas</label><textarea data-lens="notes" rows="2"></textarea><div class="lens-actions"><button type="button" onclick="extractLensResult(this)">Extraer datos del texto</button><button type="button" onclick="applyLensResult(this)">Usar esta coincidencia</button><button type="button" class="secondary" onclick="clearLensResult(this)">No es ninguna coincidencia</button></div><div class="compare-box" style="display:none"></div><div class="lens-status muted"></div></div><div class="sticky-actions actions"><button type="button" class="secondary" onclick="autoComplete(this,false)">Completar automáticamente</button><button type="button" class="secondary" onclick="autoComplete(this,true)">Investigar en web</button><button type="button" class="secondary" onclick="openLensAssistant(this)">Buscar con Google Lens</button><button type="button" class="secondary" onclick="saveDraft(this)">Guardar borrador</button><button type="button" onclick="publishReview(this)">Aprobar y publicar</button><button type="button" class="danger" onclick="rejectReview(this)">Rechazar</button></div></div></div></section>`}).join('');document.querySelectorAll('.card').forEach((card,i)=>{let r=rows[i],cat=card.querySelector('[data-f=category]');fillSub(card,r.product?.subcategory||r.proposed_subcategory);renderAttrs(card,r.attributes||{});card.querySelectorAll('input,select,textarea').forEach(x=>x.addEventListener('input',()=>updatePreview(card)));updatePreview(card)})}
function fillSub(card,selected=''){let cat=card.querySelector('[data-f=category]').value,sub=card.querySelector('[data-f=subcategory]');sub.innerHTML=Object.keys(taxonomy[cat]||{}).map(x=>`<option ${x===selected?'selected':''}>${esc(x)}</option>`).join('')}
function renderAttrs(card,values={}){let cat=card.querySelector('[data-f=category]').value;card.querySelector('.attrs-grid').innerHTML=(fieldsByCategory[cat]||[]).map(k=>`<div><label>${esc(labels[k]||k)}</label><input data-attr="${k}" value="${esc(values[k]||'')}"></div>`).join('')}
function categoryChanged(sel){let card=sel.closest('.card');fillSub(card);renderAttrs(card);updatePreview(card)}
function selectImage(btn){let card=btn.closest('.card');card.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));btn.classList.add('active');card.querySelector('.main-image').src=media(btn.dataset.image)}
function selectedImage(card){return card.querySelector('.thumb.active')?.dataset.image||card.dataset.cover}
function zoom(src){zoomImage.src=src;zoomModal.classList.add('open')}
async function setCover(btn){let card=btn.closest('.card'),image=selectedImage(card);let j=await api(`/api/universal/reviews/${card.dataset.id}/cover`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({image})});card.dataset.cover=image;card.querySelectorAll('.thumb').forEach(x=>{x.classList.toggle('cover',x.dataset.image===image);let d=x.querySelector('.cover-dot');if(d)d.remove();if(x.dataset.image===image)x.insertAdjacentHTML('beforeend','<span class="cover-dot">Portada</span>')});card.querySelector('.preview img').src=media(image);message(card,'Portada guardada.')}
async function removeImage(btn){let card=btn.closest('.card'),image=selectedImage(card);if(!image||!confirm('¿Quitar esta fotografía de la ficha? El archivo original no se elimina del disco.'))return;await api(`/api/universal/reviews/${card.dataset.id}/images?image=${encodeURIComponent(image)}`,{method:'DELETE'});location.reload()}
function addVariant(btn){btn.closest('.card').querySelector('.variant-list').insertAdjacentHTML('beforeend',variantRow({stock:1}));updatePreview(btn.closest('.card'))}
function payload(card){let p={};card.querySelectorAll('[data-f]').forEach(x=>p[x.dataset.f]=x.type==='number'?Number(x.value||0):x.value.trim());p.catalogImage=card.dataset.cover;p.attributes={};card.querySelectorAll('[data-attr]').forEach(x=>p.attributes[x.dataset.attr]=x.value.trim());p.variants=[...card.querySelectorAll('.variant')].map(v=>Object.fromEntries([...v.querySelectorAll('[data-v]')].map(x=>[x.dataset.v,x.type==='number'?Number(x.value||0):x.value.trim()])));return p}
function updatePreview(card){let p=payload(card);card.querySelector('.pv-title').textContent=p.title||'Producto sin nombre';card.querySelector('.pv-route').textContent=[p.category,p.subcategory,p.brand,p.model].filter(Boolean).join(' → ');card.querySelector('.pv-price').textContent=p.price?new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(p.price):'Precio pendiente';card.querySelector('.pv-description').textContent=p.description||''}

function setProgress(card,text){message(card,text);card.querySelector('.status').scrollIntoView({behavior:'smooth',block:'nearest'})}
function currentValue(card,key){let el=card.querySelector(`[data-f=${key}]`)||card.querySelector(`[data-attr=${key}]`);return el?el.value.trim():''}
function applySuggestion(card,key,candidate,ask=true){if(!candidate||candidate.value===undefined)return false;let map={colors:'color',sizes:'size',materials:'material',gender:'gender',type:'type',sku:'sku'},target=map[key]||key;let el=card.querySelector(`[data-f=${target}]`)||card.querySelector(`[data-attr=${target}]`);if(!el)return false;let value=Array.isArray(candidate.value)?candidate.value.join(' / '):String(candidate.value);let actual=el.value.trim();let generic=!actual||/^producto por confirmar/i.test(actual)||/^\d{4}[ _-]\d{2}[ _-]\d{2}/.test(actual)||actual==='Otros'||actual==='Coleccionables';if(actual&&actual!==value&&!generic&&ask){if(!confirm(`${target}:\nActual: ${actual}\nSugerido: ${value}\n\n¿Aplicar la sugerencia?`))return false}el.value=value;if(target==='category'){fillSub(card);renderAttrs(card)}return true}
function renderCandidates(card,items=[]){let box=card.querySelector('.candidate-box'),grid=card.querySelector('.candidate-grid');if(!items.length){box.style.display='none';grid.innerHTML='';return}box.style.display='block';grid.innerHTML=items.map(x=>`<article class="candidate"><img src="${x.image_url?media(x.image_url):'/assets/web/elegance-hero.png'}" onerror="this.style.display='none'"><b>${esc(x.name||[x.brand,x.model].filter(Boolean).join(' ')||'Coincidencia sin nombre')}</b><div class="score">${Math.round((x.confidence||0)*100)}% de confianza</div><small>${esc(x.source_name||x.source||'Fuente')}</small><p>${esc((x.evidence||[]).join(' · '))}</p>${x.source_url?`<a href="${esc(x.source_url)}" target="_blank" rel="noopener">Ver fuente</a>`:''}<button type="button" onclick="acceptCandidate(this,'${esc(x.id||'')}')">Usar esta coincidencia</button></article>`).join('')}
async function acceptCandidate(btn,id){if(!id)return;let card=btn.closest('.card');btn.disabled=true;try{let j=await api('/api/euiv/candidates/'+id+'/accept',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});let c=j.candidate||{};for(let [k,v] of Object.entries({title:c.name,brand:c.brand,model:c.model,category:c.category,subcategory:c.subcategory,colors:c.colors,sku:c.sku,description:c.description}))if(v)applySuggestion(card,k,{value:v,confidence:c.confidence,source:c.source_name,evidence:(c.evidence||[]).join('; ')},true);updatePreview(card);message(card,'Coincidencia aplicada. Revisa los campos y publica cuando estés conforme.')}catch(e){message(card,'No se pudo aplicar la coincidencia: '+e.message,true)}finally{btn.disabled=false}}
async function autoComplete(btn,forceWeb){let card=btn.closest('.card'),rid=card.dataset.id;btn.disabled=true;let peer=[...card.querySelectorAll('.sticky-actions button')];peer.forEach(x=>x.disabled=true);try{setProgress(card,'Preparando imágenes…');let detail=await api('/api/universal/reviews/'+rid),pid=detail.review.product_id;if(!pid)throw Error('La revisión no está vinculada a un producto. Vuelve al lote y crea nuevamente el grupo.');await new Promise(r=>setTimeout(r,180));setProgress(card,'Ejecutando OCR y analizando colores…');await new Promise(r=>setTimeout(r,180));setProgress(card,forceWeb?'Construyendo búsqueda con evidencias de la imagen…':'Buscando coincidencias locales y aprendizaje…');let j=await api(`/api/intelligence/products/${pid}/analyze`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({reviewId:rid,forceWeb})});if(j.usedWeb)setProgress(card,'Comparando coincidencias web…');let f=j.merged?.fields||{},applied=[];let cj=await api(`/api/euiv/products/${pid}/candidates`);renderCandidates(card,cj.candidates||[]);for(let k of ['title','brand','model','category','subcategory','description','colors','sizes','materials','gender','type','sku'])if(applySuggestion(card,k,f[k],true))applied.push(k);updatePreview(card);let lines=[];for(let [k,v] of Object.entries(f))lines.push(`${k}: ${Array.isArray(v.value)?v.value.join(', '):v.value} · ${Math.round((v.confidence||0)*100)}% · ${v.source}${v.evidence?' · '+v.evidence:''}`);let conflictCount=Object.keys(j.conflicts||{}).length;let result=`Proceso completado. ${applied.length} campo(s) aplicado(s). Confianza global ${Math.round((j.merged?.confidence||0)*100)}%.`;if(j.webError)result+=` Web: ${j.webError}`;if(conflictCount)result+=` ${conflictCount} campo(s) requerían confirmación.`;result+=' '+lines.slice(0,6).join(' | ');message(card,result,false)}catch(e){message(card,'Error encontrado: '+e.message,true)}finally{peer.forEach(x=>x.disabled=false);btn.disabled=false}}


let activeLensSession={};
function selectedImage(card){let active=card.querySelector('.thumb.active');return active?.dataset.image||card.dataset.cover||''}
async function openLensAssistant(btn){let card=btn.closest('.card'),rid=card.dataset.id;let detail=await api('/api/universal/reviews/'+rid),pid=detail.review.product_id;if(!pid){message(card,'No se puede abrir Lens: la revisión no está vinculada al producto.',true);return}let image=selectedImage(card);if(!image){message(card,'Selecciona una fotografía.',true);return}let j=await api(`/api/visual-search/products/${pid}/sessions`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({review_id:rid,image_ref:image})});activeLensSession[rid]=j.session;let panel=card.querySelector('.lens-panel');panel.classList.add('open');panel.querySelector('.lens-status').textContent='Fotografía preparada. Descárgala y abre Google Lens; Elegance seguirá abierto en esta pestaña.';panel.scrollIntoView({behavior:'smooth',block:'center'})}
function downloadLensImage(btn){let card=btn.closest('.card'),url=card.querySelector('.main-image').src,a=document.createElement('a');a.href=url;a.download='elegance-busqueda-visual.jpg';document.body.appendChild(a);a.click();a.remove();card.querySelector('.lens-status').textContent='Fotografía descargada. En Lens selecciona Subir una imagen.'}
function launchLens(btn){window.open('https://lens.google.com/','_blank','noopener');btn.closest('.lens-panel').querySelector('.lens-status').textContent='Google Lens abierto. Sube la fotografía descargada, elige la coincidencia correcta y vuelve a Elegance.'}
function lensPayload(panel){let o={};panel.querySelectorAll('[data-lens]').forEach(x=>o[x.dataset.lens]=x.value.trim());o.confidence=Number(o.confidence||0)/100;return o}
async function extractLensResult(btn){let card=btn.closest('.card'),rid=card.dataset.id,panel=btn.closest('.lens-panel'),session=activeLensSession[rid];if(!session){panel.querySelector('.lens-status').textContent='Primero abre el asistente desde el botón Buscar con Google Lens.';return}btn.disabled=true;try{let j=await api(`/api/visual-search/sessions/${session.id}/register`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(lensPayload(panel))});let x=j.extracted||{};for(let k of ['title','brand','model','sku','color','material','source']){let el=panel.querySelector(`[data-lens=${k}]`);if(el&&x[k]&&!el.value)el.value=x[k]}panel.dataset.extracted=JSON.stringify(x);panel.querySelector('.lens-status').textContent=`Datos extraídos. Confianza ${Math.round((j.confidence||0)*100)}%. Revisa y pulsa Usar esta coincidencia.`}catch(e){panel.querySelector('.lens-status').textContent='No se pudieron extraer los datos: '+e.message}finally{btn.disabled=false}}
async function applyLensResult(btn){let card=btn.closest('.card'),rid=card.dataset.id,panel=btn.closest('.lens-panel'),session=activeLensSession[rid];if(!session){panel.querySelector('.lens-status').textContent='No existe una sesión activa.';return}let data=lensPayload(panel);if(!data.title&&!data.brand&&!data.model){panel.querySelector('.lens-status').textContent='Pega el resultado o captura al menos nombre, marca o modelo.';return}let map={title:'title',brand:'brand',model:'model',category:'category',subcategory:'subcategory',sku:'sku',color:'colors',material:'materials',description:'description'};let changed=[];for(let [src,dst] of Object.entries(map)){if(data[src]&&applySuggestion(card,dst,{value:data[src],confidence:data.confidence,source:data.source||'Google Lens (asistido)',evidence:data.source_url||'Coincidencia confirmada por el usuario'},true))changed.push(dst)}updatePreview(card);await api(`/api/visual-search/sessions/${session.id}/apply`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({fields:changed,source:data.source,source_url:data.source_url,confidence:data.confidence})});panel.querySelector('.lens-status').textContent=`Coincidencia aplicada a ${changed.length} campo(s). Guarda borrador o publica para añadirla a la Biblioteca Elegance.`;message(card,'Coincidencia visual asistida aplicada. Revisa los datos antes de publicar.')}
function clearLensResult(btn){let panel=btn.closest('.lens-panel');panel.querySelectorAll('[data-lens]').forEach(x=>{if(x.dataset.lens==='source')x.value='Google Lens (asistido)';else if(x.dataset.lens==='confidence')x.value='90';else x.value=''});panel.querySelector('.lens-status').textContent='Resultado descartado. Puedes buscar con otra fotografía.'}

function message(card,text,error=false){let s=card.querySelector('.status');s.textContent=text;s.style.color=error?'#ff9da6':'#75ffb1'}
async function saveDraft(btn){let card=btn.closest('.card');btn.disabled=true;try{await api(`/api/universal/reviews/${card.dataset.id}/draft`,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(payload(card))});message(card,'Borrador guardado.')}catch(e){message(card,e.message,true)}finally{btn.disabled=false}}
async function publishReview(btn){let card=btn.closest('.card');btn.disabled=true;try{await api(`/api/universal/reviews/${card.dataset.id}/publish`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload(card))});message(card,'Producto publicado correctamente.');setTimeout(()=>card.remove(),700)}catch(e){message(card,e.message,true)}finally{btn.disabled=false}}
async function rejectReview(btn){let card=btn.closest('.card');if(!confirm('¿Rechazar esta revisión? El producto no se publicará.'))return;await api(`/api/universal/reviews/${card.dataset.id}/resolve`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'reject'})});card.remove()}

function selectedCards(){return [...document.querySelectorAll('.card[data-id]')].filter(c=>c.querySelector('.select-product')?.checked)}
function updateSelection(){let cards=selectedCards();bulkProgress.textContent=`${cards.length} seleccionado(s)`;document.querySelectorAll('.card[data-id]').forEach(c=>c.classList.toggle('selected',!!c.querySelector('.select-product')?.checked))}
function selectionChanged(){updateSelection()}
function selectAll(value){document.querySelectorAll('.select-product').forEach(x=>x.checked=value);updateSelection()}
async function bulkComplete(){let cards=selectedCards();if(!cards.length)return alert('Marca al menos un producto.');let done=0,errors=0;for(let card of cards){bulkProgress.textContent=`Completando ${done+errors+1} de ${cards.length}…`;try{let b=card.querySelector('[onclick^="autoComplete"]');await autoComplete(b,false);done++}catch(e){errors++}}bulkProgress.textContent=`Completados ${done}; con error ${errors}. Revisa antes de publicar.`}
async function bulkDraft(){let cards=selectedCards();if(!cards.length)return alert('Marca al menos un producto.');let done=0,errors=0;for(let card of cards){try{await api(`/api/universal/reviews/${card.dataset.id}/draft`,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(payload(card))});message(card,'Borrador guardado.');done++}catch(e){message(card,e.message,true);errors++}bulkProgress.textContent=`Guardando ${done+errors} de ${cards.length}…`}bulkProgress.textContent=`${done} borrador(es) guardado(s); ${errors} con error.`}
async function bulkPublish(){let cards=selectedCards();if(!cards.length)return alert('Marca al menos un producto.');if(!confirm(`Se intentarán publicar ${cards.length} producto(s). Los incompletos permanecerán en revisión y nada será eliminado. ¿Continuar?`))return;let published=0,pending=0;for(let card of cards){bulkProgress.textContent=`Publicando ${published+pending+1} de ${cards.length}…`;try{await api(`/api/universal/reviews/${card.dataset.id}/publish`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload(card))});published++;card.remove()}catch(e){pending++;message(card,e.message,true)}}bulkProgress.textContent=`Publicados ${published}; pendientes ${pending}; eliminados 0.`}

load().catch(e=>list.innerHTML='<div class="card">Error: '+esc(e.message)+'</div>');
</script></body></html>
